<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API contract</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; background: #fff; }</style>
</head>
<body>
  <!-- Opens openapi.yaml from this folder in Swagger UI. Browsers block files opened directly from disk,
       so serve the folder: npx --yes http-server <this folder> -p 8080, then open
       http://localhost:8080/swagger.html -->
  <div id="swagger"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({ url: './openapi.yaml', dom_id: '#swagger', deepLinking: true })
  </script>
</body>
</html>
